# Throwaway 3-node CrateDB for shard testing. Host ports 44200-44202 only.
# The replication profile adds a single-node subscriber on 44210; the
# replication-auth profile a publisher with password auth and TLS on its
# PostgreSQL port (44220, user repl) and a TCP balancer in front of the
# lab's PostgreSQL ports (lb:5432 inside the network). The backup profile
# is a separate 2-node cluster (shardbak, 44230-44231; bak2 isn't
# master-eligible, so it can be stopped mid-snapshot) with an fs
# repository path shared by both nodes, and RustFS for s3 (API on 44290,
# credentials obsilab/obsilab-secret; scenarios.sh backup makes the bucket).
x-node: &node
  image: crate:6.4.5
  environment:
    CRATE_HEAP_SIZE: 512m
services:
  lab1:
    <<: *node
    ports: ["127.0.0.1:44200:4200"]
    command: ["crate", "-Ccluster.name=shardlab", "-Cnode.name=lab1", "-Cdiscovery.seed_hosts=lab1,lab2,lab3", "-Ccluster.initial_master_nodes=lab1,lab2,lab3", "-Cgateway.expected_data_nodes=3", "-Cgateway.recover_after_data_nodes=2"]
  lab2:
    <<: *node
    ports: ["127.0.0.1:44201:4200"]
    command: ["crate", "-Ccluster.name=shardlab", "-Cnode.name=lab2", "-Cdiscovery.seed_hosts=lab1,lab2,lab3", "-Ccluster.initial_master_nodes=lab1,lab2,lab3", "-Cgateway.expected_data_nodes=3", "-Cgateway.recover_after_data_nodes=2"]
  lab3:
    <<: *node
    ports: ["127.0.0.1:44202:4200"]
    command: ["crate", "-Ccluster.name=shardlab", "-Cnode.name=lab3", "-Cdiscovery.seed_hosts=lab1,lab2,lab3", "-Ccluster.initial_master_nodes=lab1,lab2,lab3", "-Cgateway.expected_data_nodes=3", "-Cgateway.recover_after_data_nodes=2"]
  sub:
    <<: *node
    profiles: [replication]
    ports: ["127.0.0.1:44210:4200"]
    command: ["crate", "-Ccluster.name=shardsub", "-Cnode.name=sub1", "-Cdiscovery.type=single-node"]
  pub2:
    <<: *node
    profiles: [replication-auth]
    ports: ["127.0.0.1:44220:4200"]
    entrypoint: ["sh", "-c"]
    command:
      - >-
        /crate/jdk/bin/keytool -genkeypair -alias pub2 -keyalg RSA -keysize 2048 -validity 30
        -dname CN=pub2 -keystore /tmp/pub2.jks -storepass changeit -keypass changeit -noprompt &&
        exec /docker-entrypoint.sh crate -Ccluster.name=shardpub2 -Cnode.name=pub2 -Cdiscovery.type=single-node
        -Cauth.host_based.enabled=true
        -Cauth.host_based.config.0.user=crate -Cauth.host_based.config.0.method=trust
        -Cauth.host_based.config.1.method=password
        -Cssl.psql.enabled=true -Cssl.keystore_filepath=/tmp/pub2.jks
        -Cssl.keystore_password=changeit -Cssl.keystore_key_password=changeit
  lb:
    image: haproxy:3.0-alpine
    profiles: [replication-auth]
    volumes: ["./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro"]
  bak1:
    <<: *node
    profiles: [backup]
    ports: ["127.0.0.1:44230:4200"]
    volumes: ["bakrepo:/repo"]
    entrypoint: ["sh", "-c", "chown crate /repo && exec /docker-entrypoint.sh \"$$@\"", "--"]
    command: ["crate", "-Ccluster.name=shardbak", "-Cnode.name=bak1", "-Cdiscovery.seed_hosts=bak1", "-Ccluster.initial_master_nodes=bak1", "-Cpath.repo=/repo"]
  bak2:
    <<: *node
    profiles: [backup]
    ports: ["127.0.0.1:44231:4200"]
    volumes: ["bakrepo:/repo"]
    entrypoint: ["sh", "-c", "chown crate /repo && exec /docker-entrypoint.sh \"$$@\"", "--"]
    command: ["crate", "-Ccluster.name=shardbak", "-Cnode.name=bak2", "-Cnode.master=false", "-Cdiscovery.seed_hosts=bak1", "-Cpath.repo=/repo"]
  s3:
    image: rustfs/rustfs:latest
    profiles: [backup]
    ports: ["127.0.0.1:44290:9000"]
    environment:
      RUSTFS_ACCESS_KEY: obsilab
      RUSTFS_SECRET_KEY: obsilab-secret
volumes:
  bakrepo:
