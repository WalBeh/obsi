# TCP load balancer in front of the lab's PostgreSQL ports, for testing
# CREATE SUBSCRIPTION ... mode=pg_tunnel through a balancer.
defaults
  mode tcp
  timeout connect 5s
  timeout client 1h
  timeout server 1h
frontend psql
  bind :5432
  default_backend lab
backend lab
  balance roundrobin
  server lab1 lab1:5432
  server lab2 lab2:5432
  server lab3 lab3:5432
